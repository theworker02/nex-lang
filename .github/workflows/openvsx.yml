name: Publish Nex LSP (Open VSX)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type publish to confirm Open VSX upload of Nex LSP"
        required: true
        default: ""

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-nexus
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-nexus/package-lock.json

      - name: Install
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package Nex LSP VSIX
        run: npx vsce package --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: nex-lsp-vsix
          path: vscode-nexus/*.vsix

  publish:
    needs: package
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'release') ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'publish')
    defaults:
      run:
        working-directory: vscode-nexus
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-nexus/package-lock.json

      - name: Install
        run: npm ci

      - name: Require OVSX_PAT
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::OVSX_PAT secret is not set. Add a personal access token from https://open-vsx.org/user-settings/tokens as repository secret OVSX_PAT."
            exit 1
          fi

      - name: Compile
        run: npm run compile

      - name: Package Nex LSP VSIX
        run: npx vsce package --no-dependencies

      - name: Publish Nex LSP to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish "*.vsix" --pat "$OVSX_PAT"
